name: Build & Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # daily submodule refresh
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load deploy keys for private submodules
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_KEY_POTSDAM_MEDIA }}
            ${{ secrets.SSH_KEY_WEBSITE_SHOWCASE }}

      - name: Init submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote --merge

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site
          # Shared exclude list — keep dev / VCS / config files out of the deployed artifact.
          EXCLUDES=(
            --exclude='.git'           --exclude='.github'        --exclude='.gitignore'
            --exclude='.gitattributes' --exclude='.gitmodules'
            --exclude='README.md'      --exclude='README'         --exclude='LICENSE*'
            --exclude='CHANGELOG*'     --exclude='CONTRIBUTING*'
            --exclude='node_modules'   --exclude='package.json'   --exclude='package-lock.json'
            --exclude='yarn.lock'      --exclude='pnpm-lock.yaml'
            --exclude='worker'         --exclude='worker-*'       --exclude='workers'
            --exclude='wrangler.toml'  --exclude='*.toml'
            --exclude='.env'           --exclude='.env.*'         --exclude='*.env'
            --exclude='.vscode'        --exclude='.idea'          --exclude='.DS_Store'
            --exclude='*.log'          --exclude='*.bak'          --exclude='*.swp'
            --exclude='*.map'          --exclude='*.key'          --exclude='*.pem'
            --exclude='*.crt'          --exclude='secrets*'       --exclude='credentials*'
            --exclude='src'            --exclude='scripts'        --exclude='test'
            --exclude='tests'          --exclude='__tests__'      --exclude='*.test.*'
            --exclude='*.spec.*'       --exclude='tsconfig*.json' --exclude='vite.config.*'
            --exclude='webpack.config.*'
          )
          # 1) Root = potsdam-media
          rsync -a "${EXCLUDES[@]}" _src/potsdam-media/ _site/
          # 2) /website-showcase
          mkdir -p _site/website-showcase
          rsync -a "${EXCLUDES[@]}" _src/website-showcase/ _site/website-showcase/
          # 3) CNAME (custom domain)
          cp CNAME _site/CNAME
          # 4) Sanity: list what we ship + warn on anything suspicious
          echo "=== _site root ==="
          ls -la _site
          echo "=== _site/website-showcase ==="
          ls -la _site/website-showcase
          echo "=== Scan for leaked dev files (should be empty) ==="
          find _site \( -name '*.toml' -o -name '*.env*' -o -name '*.key' -o -name 'wrangler*' -o -name 'package.json' \) -print | tee /tmp/leaks.txt
          if [ -s /tmp/leaks.txt ]; then
            echo "::error::Dev files leaked into _site (see list above)"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
